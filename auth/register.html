<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse — PreuOnline Matemáticas</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-layout">

  <!-- Branded left panel -->
  <div class="auth-brand">
    <a href="/" class="back-home">← Volver al inicio</a>
    <div class="brand-logo">
      <div class="brand-sigma">∑</div>
      <div class="brand-name">Preu<span>Online</span></div>
    </div>
    <p class="brand-tagline">Únete a miles de estudiantes que mejoran su puntaje PAES M1 y M2 con nosotros.</p>
    <div class="brand-formulas">
      f(x) = 2x² + 3x − 5<br>
      Δ = b² − 4ac<br>
      ∑(i=1 → n) = n(n+1)/2<br>
      log(a·b) = log a + log b
    </div>
  </div>

  <!-- Form panel -->
  <div class="auth-form-panel">
    <div class="auth-card">
      <h1>Crear Cuenta</h1>
      <p class="subtitle">Completa tus datos para comenzar a prepararte</p>

      <div class="alert alert-error" id="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required autocomplete="given-name">
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" placeholder="Tu apellido" required autocomplete="family-name">
          </div>
        </div>

        <div class="form-group">
          <label for="colegio">Colegio</label>
          <input type="text" id="colegio" placeholder="Nombre de tu colegio" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="+56 9 1234 5678" required autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="password2">Confirmar contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password2" placeholder="Repite tu contraseña" required autocomplete="new-password">
            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="margin-top: 8px;">
          <span class="spinner"></span>
          <span class="btn-text">Crear mi cuenta</span>
        </button>
      </form>

      <p class="form-footer">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </div>
  </div>

</div>

<script>
const form = document.getElementById('registerForm');
const alertEl = document.getElementById('alert');
const btn = document.getElementById('submitBtn');

// Toggle password visibility
document.querySelectorAll('.toggle-password').forEach(toggle => {
  toggle.addEventListener('click', function() {
    const input = this.previousElementSibling;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    this.textContent = isPassword ? '🔒' : '👁';
  });
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertEl.classList.remove('show');

  const nombre   = document.getElementById('nombre').value.trim();
  const apellido = document.getElementById('apellido').value.trim();
  const colegio  = document.getElementById('colegio').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  // Validate
  if (!nombre || !apellido || !colegio || !telefono || !email || !password) {
    showError('Todos los campos son obligatorios');
    return;
  }
  if (password.length < 6) {
    showError('La contraseña debe tener al menos 6 caracteres');
    return;
  }
  if (password !== password2) {
    showError('Las contraseñas no coinciden');
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, apellido, colegio, telefono, email, password })
    });
    const data = await res.json();

    if (!data.ok) {
      showError(data.error || 'Error al registrarse');
      return;
    }

    // Redirect to student dashboard
    window.location.href = '/estudiante/';
  } catch (err) {
    showError('Error de conexión. Inténtalo de nuevo.');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

function showError(msg) {
  alertEl.textContent = msg;
  alertEl.classList.add('show');
}
</script>
</body>
</html>
